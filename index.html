<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:site_name" content="TCC Esports" />
    <meta property="og:url" content="https://tccmlesports.vercel.app/" />
    <meta property="og:title" content="TCC Esports — Mobile Legends Tournaments" />
    <meta property="og:description" content="Live brackets, standings, player leaderboards and highlights of the TCC Mobile Legends: Bang Bang tournaments. Let the game begin!" />
    <meta property="og:image" content="https://tccmlesports.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://tccmlesports.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TCC Esports — Mobile Legends: Bang Bang tournaments. Let the game begin." />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TCC Esports — Mobile Legends Tournaments" />
    <meta name="twitter:description" content="Live brackets, standings, player leaderboards and highlights. Let the game begin!" />
    <meta name="twitter:image" content="https://tccmlesports.vercel.app/og-image.png" />
    <link rel="canonical" href="https://tccmlesports.vercel.app/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TCC Esports</title>
    <script>
      // Apply the saved theme before first paint (prevents a flash of the wrong theme).
      // Overlay routes are always transparent + dark and skip the toggle.
      (function () {
        try {
          var isOverlay = location.pathname.indexOf('/overlay') === 0;
          var saved = localStorage.getItem('tcc-theme');
          var dark = isOverlay || saved !== 'light';
          document.documentElement.classList.toggle('dark', dark);
          if (isOverlay) document.documentElement.classList.add('overlay-mode');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
