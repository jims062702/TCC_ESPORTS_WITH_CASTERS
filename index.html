<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b0e" />
    <meta name="description" content="TCC Esports — Mobile Legends: Bang Bang tournaments, live brackets, standings and player leaderboards. Let the game begin." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TCC Esports</title>
    <script>
      // Apply the saved theme before first paint (prevents a flash of the wrong theme).
      // Overlay routes are always transparent + dark and skip the toggle.
      (function () {
        try {
          var isOverlay = location.pathname.indexOf('/overlay') === 0;
          var saved = localStorage.getItem('tcc-theme');
          var dark = isOverlay || saved !== 'light';
          document.documentElement.classList.toggle('dark', dark);
          if (isOverlay) document.documentElement.classList.add('overlay-mode');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
